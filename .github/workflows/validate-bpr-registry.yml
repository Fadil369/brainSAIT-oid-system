name: Validate BPR Registry Worker (no auto-deploy)

on:
  push:
    branches:
      - main
    paths:
      - "workers/bpr-registry/**"
      - ".github/workflows/validate-bpr-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-worker:
    name: Validate bpr-registry bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --no-save wrangler@4.120.0
        working-directory: workers/bpr-registry
      - run: npx wrangler deploy --dry-run
        working-directory: workers/bpr-registry
