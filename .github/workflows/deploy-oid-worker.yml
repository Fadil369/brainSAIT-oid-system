name: Deploy OID Fulfillment Worker & Upload Assets

on:
  push:
    branches:
      - main
    paths:
      - "workers/oid-order-fulfillment/**"
      - ".github/workflows/deploy-oid-worker.yml"
  pull_request:
    branches:
      - main
    paths:
      - "workers/oid-order-fulfillment/**"
      - ".github/workflows/deploy-oid-worker.yml"
  workflow_dispatch:
    inputs:
      upload_assets:
        description: "Upload product assets to R2"
        type: boolean
        default: true
      deploy_worker:
        description: "Deploy fulfillment worker"
        type: boolean
        default: true

permissions:
  contents: read

env:
  WORKER_DIR: workers/oid-order-fulfillment
  ASSETS_DIR: workers/oid-order-fulfillment/assets/source
  DELIVERY_BASE_URL: https://assets.brainsait.org

jobs:
  # ── 1. Validate the Worker without production credentials ────
  validate-worker:
    name: Validate oid-order-fulfillment Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.WORKER_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKER_DIR }}
        run: npm ci

      - name: Validate Wrangler configuration and bundle
        working-directory: ${{ env.WORKER_DIR }}
        run: npm run deploy -- --dry-run --env production --outdir /tmp/oid-worker-dist

  # ── 2. Deploy the Fulfillment Worker ─────────────────────────
  deploy-worker:
    name: Deploy oid-order-fulfillment Worker
    runs-on: ubuntu-latest
    needs: validate-worker
    environment: production
    if: >-
      ${{
        vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
        (
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' &&
           github.ref == 'refs/heads/main' &&
           github.event.inputs.deploy_worker != 'false')
        )
      }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.WORKER_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKER_DIR }}
        run: npm ci

      - name: Validate deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHOPIFY_WEBHOOK_SECRET: ${{ secrets.SHOPIFY_WEBHOOK_SECRET }}
          LICENSE_SIGNING_SECRET: ${{ secrets.LICENSE_SIGNING_SECRET }}
          DELIVERY_ADMIN_TOKEN: ${{ secrets.DELIVERY_ADMIN_TOKEN }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          test -n "$SHOPIFY_WEBHOOK_SECRET" || { echo "::error::SHOPIFY_WEBHOOK_SECRET is not configured"; exit 1; }
          test -n "$LICENSE_SIGNING_SECRET" || { echo "::error::LICENSE_SIGNING_SECRET is not configured"; exit 1; }
          test -n "$DELIVERY_ADMIN_TOKEN" || { echo "::error::DELIVERY_ADMIN_TOKEN is not configured"; exit 1; }
          test -n "$AIRTABLE_API_KEY" || { echo "::error::AIRTABLE_API_KEY is not configured"; exit 1; }

      - name: Deploy with Wrangler
        working-directory: ${{ env.WORKER_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy -- --env production

      - name: Set Worker Secrets
        working-directory: ${{ env.WORKER_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.SHOPIFY_WEBHOOK_SECRET }}" | npx wrangler secret put SHOPIFY_WEBHOOK_SECRET --env production
          echo "${{ secrets.LICENSE_SIGNING_SECRET }}" | npx wrangler secret put LICENSE_SIGNING_SECRET --env production
          echo "${{ secrets.DELIVERY_ADMIN_TOKEN }}" | npx wrangler secret put DELIVERY_ADMIN_TOKEN --env production
          echo "${{ secrets.AIRTABLE_API_KEY }}" | npx wrangler secret put AIRTABLE_API_KEY --env production

  # ── 3. Package and Upload Assets to R2 ───────────────────────
  upload-assets:
    name: Package & Upload Product Assets to R2
    runs-on: ubuntu-latest
    environment: production
    if: >-
      ${{
        vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
        (
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' &&
           github.ref == 'refs/heads/main' &&
           github.event.inputs.upload_assets != 'false')
        )
      }}
    needs: validate-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate upload secret
        env:
          DELIVERY_ADMIN_TOKEN: ${{ secrets.DELIVERY_ADMIN_TOKEN }}
        run: |
          test -n "$DELIVERY_ADMIN_TOKEN" || { echo "::error::DELIVERY_ADMIN_TOKEN is not configured"; exit 1; }

      - name: Install zip utility
        run: sudo apt-get install -y zip

      - name: Create output directory
        run: mkdir -p /tmp/oid-assets

      - name: Package OID Starter Kit
        run: |
          cd $ASSETS_DIR/oid-starter
          zip -r /tmp/oid-assets/oid-starter-templates.zip .
          cp README.md /tmp/oid-assets/oid-namespace-starter-guide.html

      - name: Package OID Developer Suite (SDK)
        run: |
          cd $ASSETS_DIR/oid-developer
          zip -r /tmp/oid-assets/oid-sdk.zip sdk/
          zip -r /tmp/oid-assets/oid-code-examples.zip examples/
          echo "# OID Developer Suite Documentation" > /tmp/oid-assets/oid-developer-docs.html
          echo "See oid-sdk.zip for the full TypeScript SDK" >> /tmp/oid-assets/oid-developer-docs.html

      - name: Package Healthcare Bundle
        run: |
          cd $ASSETS_DIR/oid-healthcare
          zip -r /tmp/oid-assets/fhir-namespace-bundle.zip fhir-namespace-bundle.json nphies-fhir-profiles.json ihe-iti-oid-mappings.json
          cp dicom-uid-allocation.md /tmp/oid-assets/dicom-uid-guide.html
          zip -r /tmp/oid-assets/hl7-templates.zip . --exclude="*.zip"

      - name: Package Enterprise Platform
        run: |
          cd $ASSETS_DIR/oid-enterprise
          zip -r /tmp/oid-assets/enterprise-platform.zip .
          cp README.md /tmp/oid-assets/enterprise-docs.html
          zip -r /tmp/oid-assets/enterprise-config-templates.zip enterprise-config.yaml nginx-oid-routing.conf docker-compose.yml

      - name: Package Badge System
        run: |
          cd $ASSETS_DIR/oid-badge
          zip -r /tmp/oid-assets/badge-system-source.zip .
          cp README.md /tmp/oid-assets/badge-system-docs.html

      - name: Package Enterprise Architect
        run: |
          cd $ASSETS_DIR/oid-ent-arch
          zip -r /tmp/oid-assets/namespace-architect-kit.zip .
          zip -r /tmp/oid-assets/fhir-namespace-bundle-r4-r5.zip fhir-bundle/
          zip -r /tmp/oid-assets/mcp-urn-schemas.zip mcp-schemas/
          cp x509-policy-comprehensive.conf /tmp/oid-assets/x509-policy-comprehensive.conf
          cp README.md /tmp/oid-assets/enterprise-architect-docs.html
          echo "# Portal Access Guide\n\nPortal: https://portal.brainsait.com\nEmail: architect@brainsait.com" > /tmp/oid-assets/portal-access-guide.html

      - name: Package Healthcare Suite
        run: |
          cd $ASSETS_DIR/oid-hlth-suite
          zip -r /tmp/oid-assets/healthcare-ai-identity-suite.zip .
          zip -r /tmp/oid-assets/fhir-extension-registry.zip fhir-ext/
          zip -r /tmp/oid-assets/audit-trail-oid-schema.zip audit-schema/
          cp snomed-ct-oid-mapping.json /tmp/oid-assets/snomed-ct-oid-mapping.json
          cp README.md /tmp/oid-assets/dicom-uid-allocation-block.html
          cp README.md /tmp/oid-assets/hipaa-namespace-documentation.html

      - name: Package FHIR Platform
        run: |
          cd $ASSETS_DIR/oid-fhir-platform
          zip -r /tmp/oid-assets/fhir-integration-toolkit.zip toolkit/
          zip -r /tmp/oid-assets/ig-template-with-oid.zip ig-template/
          zip -r /tmp/oid-assets/fsh-template-library.zip fsh-library/
          zip -r /tmp/oid-assets/structuredefinition-oid-migration.zip migration/
          cp README.md /tmp/oid-assets/fhir-platform-docs.html

      - name: Package White-Label Enterprise
        run: |
          cd $ASSETS_DIR/oid-white-label
          zip -r /tmp/oid-assets/white-label-enterprise-package.zip .
          zip -r /tmp/oid-assets/oid-portal-react-source.zip portal-source/
          cp reseller-guide.md /tmp/oid-assets/reseller-setup-guide.html
          cp README.md /tmp/oid-assets/multitenant-architecture-docs.html
          zip -r /tmp/oid-assets/white-label-brand-kit.zip brand-kit/

      - name: List packaged assets
        run: ls -lh /tmp/oid-assets/

      - name: Upload OID Starter Guide
        run: |
          curl -sf -X PUT \
            "${{ env.DELIVERY_BASE_URL }}/admin/objects/products/oid-starter/oid-namespace-starter-guide.html" \
            -H "x-hub-key: ${{ secrets.DELIVERY_ADMIN_TOKEN }}" \
            -H "Content-Type: text/html" \
            --data-binary @/tmp/oid-assets/oid-namespace-starter-guide.html

      - name: Upload OID Starter Templates ZIP
        run: |
          curl -sf -X PUT \
            "${{ env.DELIVERY_BASE_URL }}/admin/objects/products/oid-starter/oid-templates.zip" \
            -H "x-hub-key: ${{ secrets.DELIVERY_ADMIN_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @/tmp/oid-assets/oid-starter-templates.zip

      - name: Upload Developer SDK ZIP
        run: |
          curl -sf -X PUT \
            "${{ env.DELIVERY_BASE_URL }}/admin/objects/products/oid-developer/oid-sdk.zip" \
            -H "x-hub-key: ${{ secrets.DELIVERY_ADMIN_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @/tmp/oid-assets/oid-sdk.zip

      - name: Upload Developer Docs
        run: |
          curl -sf -X PUT \
            "${{ env.DELIVERY_BASE_URL }}/admin/objects/products/oid-developer/oid-developer-docs.html" \
            -H "x-hub-key: ${{ secrets.DELIVERY_ADMIN_TOKEN }}" \
