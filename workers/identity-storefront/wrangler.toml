name = "brainsait-identity-storefront"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# account_id provided by CI env; do not commit.

routes = [
  { pattern = "identity.brainsait.org", custom_domain = true }
]

[vars]
SHOP_BASE_URL = "https://id.brainsait.org"
REGISTRY_URL = "https://registry.brainsait.org"
OID_ROOT = "1.3.6.1.4.1.61026"
SITE_BASE_URL = "https://identity.brainsait.org"

# No secrets required. Storefront redirects to Shopify + registry.
