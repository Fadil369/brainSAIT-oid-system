name = "bpr-registry"
main = "src/index.ts"
compatibility_date = "2024-09-25"

routes = [
  { pattern = "registry.brainsait.org/*", zone_name = "brainsait.org" },
  # OID browser alias — same validated tree, second front door (Master Spec §53)
  { pattern = "oid.brainsait.org/*", zone_name = "brainsait.org" }
]

d1_databases = [
  { binding = "PLATFORM_DB", database_name = "brainsait-platform", database_id = "f6a576f1-1d43-4092-8546-496ed0efd0e9" },
]

kv_namespaces = [
  { binding = "SESSION_KV", id = "5b9f673b131a4a4399e31d924281e80a" },
]

services = [
  { binding = "PASSPORT", service = "agent-passport" },
]
