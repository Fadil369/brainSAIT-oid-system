version: "3.9"

# BrainSAIT OID Enterprise Platform — Docker Compose
# IANA PEN 61026

services:
  oid-gateway:
    image: brainsait/oid-gateway:latest
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      OID_ROOT: "1.3.6.1.4.1.61026"
      IANA_PEN: "61026"
      JWT_SECRET: "${JWT_SECRET}"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      - redis
      - oid-registry
    labels:
      com.brainsait.oid: "1.3.6.1.4.1.61026.1"

  oid-registry:
    image: brainsait/oid-registry:latest
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://oid:${DB_PASSWORD}@postgres:5432/oid_registry"
      OID_ROOT: "1.3.6.1.4.1.61026"
    depends_on:
      - postgres

  oid-fhir-adapter:
    image: brainsait/oid-fhir-adapter:latest
    ports:
      - "8100:8100"
    environment:
      OID_NODE: "1.3.6.1.4.1.61026.3.2.3"
      FHIR_SERVER_URL: "${FHIR_SERVER_URL}"
      NPHIES_API_URL: "${NPHIES_API_URL}"
    labels:
      com.brainsait.oid: "1.3.6.1.4.1.61026.3.2.3"

  oid-ai-agent:
    image: brainsait/oid-ai-agent:latest
    ports:
      - "8200:8200"
    environment:
      OID_NODE: "1.3.6.1.4.1.61026.3.3"
      MODEL_ENDPOINT: "${AI_MODEL_ENDPOINT}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
    labels:
      com.brainsait.oid: "1.3.6.1.4.1.61026.3.3"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oid_registry
      POSTGRES_USER: oid
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-oid-routing.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - oid-gateway

volumes:
  postgres_data:
  redis_data:
