  ai_agents:  "1.3.6.1.4.1.61026.3.3"
  iot_edge:   "1.3.6.1.4.1.61026.4"

fhir:
  server_url: "${FHIR_SERVER_URL}"
  version: "R4"
  nphies_api_url: "${NPHIES_API_URL}"

logging:
  level: "info"
  format: "json"
