# BrainSAIT OID Enterprise — NGINX Routing Configuration
# IANA PEN 61026

upstream oid_gateway {
    server oid-gateway:8080;
    keepalive 32;
}

upstream oid_fhir_adapter {
    server oid-fhir-adapter:8100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oid.brainsait.org;

    ssl_certificate     /etc/ssl/certs/oid.crt;
    ssl_certificate_key /etc/ssl/private/oid.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # OID resolution
    location /oid/ {
        proxy_pass         http://oid_gateway/oid/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # FHIR endpoints
    location /fhir/ {
        proxy_pass         http://oid_fhir_adapter/fhir/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://oid_gateway/health;
    }
}
