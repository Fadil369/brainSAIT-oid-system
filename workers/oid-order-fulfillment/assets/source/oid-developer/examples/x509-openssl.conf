# BrainSAIT OID X.509 Policy Extension — OpenSSL Configuration
# IANA PEN 61026 — 1.3.6.1.4.1.61026

[ req ]
default_bits       = 4096
default_md         = sha384
prompt             = no
distinguished_name = dn

[ dn ]
C  = SA
ST = Riyadh Province
L  = Riyadh
O  = BrainSAIT
OU = Healthcare Operations
CN = brainsait.com

[ brainsait_oid_policy ]
certificatePolicies = @brainsait_policy_section

[ brainsait_policy_section ]
policyIdentifier = 1.3.6.1.4.1.61026.2.2
CPS.1            = https://brainsait.com/cps/1.0
userNotice.1     = @brainsait_notice

[ brainsait_notice ]
explicitText = "BrainSAIT Certificate Policy — NPHIES FHIR Healthcare Integration"

[ nphies_oid_policy ]
certificatePolicies = @nphies_policy_section

[ nphies_policy_section ]
policyIdentifier = 1.3.6.1.4.1.61026.3.2.3
CPS.1            = https://brainsait.com/cps/nphies/1.0

[ ai_agent_oid_policy ]
certificatePolicies = @ai_agent_policy_section

[ ai_agent_policy_section ]
policyIdentifier = 1.3.6.1.4.1.61026.3.3
CPS.1            = https://brainsait.com/cps/ai-agent/1.0
